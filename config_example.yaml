OUTPUT_DIR: ''
PICKLES_DIR: ''
TMP_DIR: ''

# General options
CRS: 'EPSG:2056'
YEAR_START_MOBILIAR: 2013
YEAR_END_MOBILIAR: 2022
YEAR_START_GVZ: 2005
YEAR_END_GVZ: 2022
YEAR_START_TEST: 2023
YEAR_END_TEST: 2024

# CID (cells IDs) raster path (not needed for Switzerland)
CID_PATH: 'path/to/cids.tif'

# Contract and damage data directories
DIR_EXPOSURE_MOBILIAR: ''
DIR_CLAIMS_MOBILIAR: ''
DIR_EXPOSURE_GVZ: ''
DIR_CLAIMS_GVZ: ''

# Paths to the events parquet files, per extraction method and precipitation
# dataset (the simple method exists for hourly and 5-min precipitation; the
# classic method relies on hourly data by definition)
EVENTS_PATH_SIMPLE_HOURLY: 'path/to/events_cpc_model_domain_2005_2024_simple.parquet'
EVENTS_PATH_SIMPLE_5MIN: 'path/to/events_cpc_5min_model_domain_2020_2024_simple.parquet'
EVENTS_PATH_CLASSIC: 'path/to/events_cpc_model_domain_2005_2024_classic.parquet'

# Path to the precipitation directory (hourly CombiPrecip netCDF files)
DIR_PRECIP: ''

# Path to the hourly CombiPrecip zarr store (built once from DIR_PRECIP by
# scripts/data_preparation/build_precip_hourly_zarr.py; needs ~10-15 GB of disk)
PATH_PRECIP_HOURLY_ZARR: ''

# Path to the 5-minute CombiPrecip (CPCH) directory (<YEAR>/<DOY>/CPCH*.zip)
DIR_PRECIP_5MIN: ''

# Path to the 5-minute CombiPrecip zarr store (built once from DIR_PRECIP_5MIN by
# scripts/data_preparation/build_precip_5min_zarr.py; needs ~20-30 GB of disk)
PATH_PRECIP_5MIN_ZARR: ''

# DEMs (with different resolutions)
DEM_PATH: 'path/to/dem_cids.tif'
DEM_PATHS:
  - 'path/to/dem_250m.tif'
  - 'path/to/dem_100m.tif'
  - 'path/to/dem_050m.tif'
  - 'path/to/dem_025m.tif'
  - 'path/to/dem_010m.tif'

# Computation of the flow accumulation
LAKES_PATH: ''
FLOWACC_RIVER_THRESHOLD: 50000

# Path to the static attributes as csv files
CSV_FILE_SWF: 'path/to/cpc_grid_exposure_swf.csv'
CSV_FILE_TERRAIN: 'path/to/static_terrain.csv'
CSV_FILE_FLOWACC: 'path/to/static_flowacc.csv'
CSV_FILE_TWI: 'path/to/static_twi.csv'
CSV_FILE_RUNOFF_COEFF: 'path/to/static_runoff_coeff.csv'
CSV_FILE_LAND_COVER: 'path/to/static_land_cover.csv'

# Path to the buildings layer
BUILDINGS_GPKG: 'path/to/Buildings_TLM.gpkg'
BUILDINGS_LAYER: 'tlm_bauten_gebaeude_footprint'
