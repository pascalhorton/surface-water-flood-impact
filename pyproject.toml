[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
# -p no:zarr: the zarr pytest plugin imports zarr at startup, which makes the
# netCDF4 import emit a numpy-ABI RuntimeWarning that filterwarnings turns into
# a collection error.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:zarr"]
xfail_strict = true
filterwarnings = [
    "error",
    # Keras serialises variables with np.asarray(v, copy=False), which
    # NumPy 2 deprecates. It is raised from
    # keras/src/backend/tensorflow/core.py, not from this project, and
    # there is nothing to fix here until Keras stops doing it - without
    # this line every model save/load test fails on the warning alone.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
testpaths = ["tests"]
